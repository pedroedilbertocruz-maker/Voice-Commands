name: Build

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:

env:
  SYMGEN_VERSION: v1.3.6

jobs:
  build:
    name: Build ${{matrix.platform}}
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Vosk (offline speech recognition) ships prebuilt libraries for these platforms.
          - platform: linux-x86_64
            runner: ubuntu-latest
            test: true
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: windows-amd64
            runner: windows-latest
            msvc_arch: amd64

    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Dusklight version
        id: dusklight
        shell: bash
        run: echo "version=$(sed -n 's/.*set(DUSKLIGHT_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache Dusklight sources
        uses: actions/cache@v6
        with:
          path: dusklight
          key: dusklight-${{runner.os}}-${{steps.dusklight.outputs.version}}

      - name: Enable Visual Studio environment
        if: matrix.msvc_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      - name: Install ninja
        if: matrix.msvc_arch
        run: choco install ninja

      - name: Configure CMake
        shell: bash
        run: |
          args=(-G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo)
          if [[ "${{matrix.test}}" == "true" ]]; then args+=(-DVOICE_BUILD_TESTS=ON); fi
          cmake -B build "${args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Speech recognition test (synthesized voices)
        if: matrix.test
        shell: bash
        run: |
          set +e  # collect every result before deciding pass/fail
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          python3 -m pip install -q --user --break-system-packages gTTS
          export PATH="$HOME/.local/bin:$PATH"
          sha256sum build/_deps/vosk-model-*.zip
          lib=$(ls build/_deps/vosk-linux-x86_64-*/libvosk.so)
          status=0
          for lang in en pt; do
            espeak=$([[ $lang == en ]] && echo en-us || echo pt-br)
            gtld=$([[ $lang == en ]] && echo com || echo com.br)
            for engine in google espeak; do
              dir=wav/$lang/$engine
              mkdir -p $dir
              args=()
              n=0
              while IFS='|' read -r idx phrase; do
                n=$((n+1))
                if [[ $engine == google ]]; then
                  gtts-cli -l $lang --tld $gtld "$phrase" -o $dir/$n.mp3 </dev/null && \
                    ffmpeg -nostdin -loglevel error -y -i $dir/$n.mp3 -ar 16000 -ac 1 $dir/$n.wav || continue
                else
                  espeak-ng -v "$espeak" -s 130 -w $dir/$n.wav "$phrase" </dev/null
                fi
                args+=("$dir/$n.wav=$idx")
              done < <(./build/voice_recognize "$lib" build/voice_res/models/$lang $lang --phrases)
              out=$(./build/voice_recognize "$lib" build/voice_res/models/$lang $lang "${args[@]}" 2>&1)
              result=$?
              # The Google voice is close to natural speech and gates the build; the robotic
              # eSpeak voice is reported for information only.
              if [[ $engine == google && $result != 0 ]]; then status=1; fi
              echo "$out"
              msg=$(printf '%s' "$out" | sed -e ':a;N;$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
              echo "::notice title=recognition-$lang-$engine::$msg"
            done
          done
          exit $status

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{matrix.platform}}
          path: build/mods/*.dusk
          if-no-files-found: error

  combine:
    name: Combine bundles
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download platform bundles
        uses: actions/download-artifact@v8
        with:
          pattern: mod-*
          path: dist

      - name: Install symgen
        run: |
          curl -fsSL -o symgen \
            "https://github.com/encounter/symgen/releases/download/${SYMGEN_VERSION}/symgen-linux-x86_64"
          chmod +x symgen

      - name: Merge bundles
        run: |
          name=$(basename dist/mod-linux-x86_64/*.dusk)
          set +e
          python3 tools/merge_mod.py -o "combined/$name" --symgen ./symgen \
            dist/*/*.dusk > merge.log 2>&1
          status=$?
          cat merge.log
          if [ $status -ne 0 ]; then
            echo "::error title=merge::$(tail -c 3000 merge.log | sed -e ':a;N;$!ba' -e 's/%/%25/g' -e 's/\n/%0A/g')"
          fi
          exit $status

      - name: Upload combined bundle
        uses: actions/upload-artifact@v7
        with:
          name: mod-combined
          path: combined/*.dusk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{github.token}}
        run: gh release create "$GITHUB_REF_NAME" combined/*.dusk --verify-tag --generate-notes
