name: Build

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:

env:
  SYMGEN_VERSION: v1.3.6

jobs:
  build:
    name: Build ${{matrix.platform}}
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Vosk (offline speech recognition) ships prebuilt libraries for these platforms.
          - platform: linux-x86_64
            runner: ubuntu-latest
            test: true
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: windows-amd64
            runner: windows-latest
            msvc_arch: amd64

    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Dusklight version
        id: dusklight
        shell: bash
        run: echo "version=$(sed -n 's/.*set(DUSKLIGHT_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache Dusklight sources
        uses: actions/cache@v6
        with:
          path: dusklight
          key: dusklight-${{runner.os}}-${{steps.dusklight.outputs.version}}

      - name: Enable Visual Studio environment
        if: matrix.msvc_arch
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      - name: Install ninja
        if: matrix.msvc_arch
        run: choco install ninja

      - name: Configure CMake
        shell: bash
        run: |
          args=(-G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo)
          if [[ "${{matrix.test}}" == "true" ]]; then args+=(-DVOICE_BUILD_TESTS=ON); fi
          cmake -B build "${args[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Speech recognition test (synthesized voice)
        if: matrix.test
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng >/dev/null
          sha256sum build/_deps/vosk-model-*.zip
          lib=$(ls build/_deps/vosk-linux-x86_64-*/libvosk.so)
          status=0
          for lang in en pt; do
            voice=$([[ $lang == en ]] && echo en-us || echo pt-br)
            mkdir -p wav/$lang
            args=()
            n=0
            while IFS='|' read -r idx phrase; do
              n=$((n+1))
              espeak-ng -v "$voice" -s 130 -w "wav/$lang/$n.wav" "$phrase"
              args+=("wav/$lang/$n.wav=$idx")
              echo "$n: $phrase" >> "wav/$lang/index.txt"
            done < <(./build/voice_recognize "$lib" build/voice_res/models/$lang $lang --phrases)
            ./build/voice_recognize "$lib" build/voice_res/models/$lang $lang "${args[@]}" || status=1
            cat "wav/$lang/index.txt"
          done
          exit $status

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{matrix.platform}}
          path: build/mods/*.dusk
          if-no-files-found: error

  combine:
    name: Combine bundles
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download platform bundles
        uses: actions/download-artifact@v8
        with:
          pattern: mod-*
          path: dist

      - name: Install symgen
        run: |
          curl -fsSL -o symgen \
            "https://github.com/encounter/symgen/releases/download/${SYMGEN_VERSION}/symgen-linux-x86_64"
          chmod +x symgen

      - name: Merge bundles
        run: |
          name=$(basename dist/mod-linux-x86_64/*.dusk)
          python3 tools/merge_mod.py -o "combined/$name" --symgen ./symgen \
            dist/*/*.dusk

      - name: Upload combined bundle
        uses: actions/upload-artifact@v7
        with:
          name: mod-combined
          path: combined/*.dusk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{github.token}}
        run: gh release create "$GITHUB_REF_NAME" combined/*.dusk --verify-tag --generate-notes
